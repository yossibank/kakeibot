name: Verify

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  DERIVED_DATA: ~/Library/Developer/Xcode/DerivedData

jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.DERIVED_DATA }}/Kakeibot-*/Build
            ${{ env.DERIVED_DATA }}/Kakeibot-*/SourcePackages
            ${{ env.DERIVED_DATA }}/ModuleCache.noindex
          key: derived-data-${{ hashFiles('ios/Kakeibot.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            derived-data-${{ hashFiles('ios/Kakeibot.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
      - run: make test
      - if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.DERIVED_DATA }}/Kakeibot-*/Build
            ${{ env.DERIVED_DATA }}/Kakeibot-*/SourcePackages
            ${{ env.DERIVED_DATA }}/ModuleCache.noindex
          key: derived-data-${{ hashFiles('ios/Kakeibot.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
